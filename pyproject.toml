[tool.pytest.ini_options]
# Airflow only puts plugins/ on sys.path once airflow itself is imported, so
# without this a "pure Python" unit test would still need the orchestrator
# loaded just to import a dataclass. Declaring the path here lets unit tests
# run against a bare checkout — no image, no scheduler, no database.
pythonpath = ["plugins", "dags"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "airflow: test requires Airflow to be importable (DAG structure tests)",
]
