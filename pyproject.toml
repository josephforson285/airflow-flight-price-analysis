[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-pipeline"
version = "0.1.0"
description = "Pipeline logic for the Bangladesh flight price analysis DAG"
requires-python = ">=3.12"
# Airflow and the providers are deliberately NOT listed. This package must be
# installable and testable without them — that is the whole point of keeping
# the logic Airflow-free. The DAG supplies database connections as callables.
dependencies = ["PyYAML>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 90
target-version = "py312"
extend-exclude = ["logs"]

[tool.ruff.lint]
# E/W pycodestyle · F pyflakes · I import order · UP pyupgrade
# B bugbear (mutable defaults, loop-variable capture) · SIM simplification
# C4 comprehensions · PTH prefer pathlib · RUF ruff-specific
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]

[tool.ruff.lint.isort]
# Without this, our own package gets sorted in among airflow/pytest as though
# it were a third-party dependency.
known-first-party = ["flight_pipeline"]

[tool.ruff.lint.per-file-ignores]
# Airflow DAG files legitimately build objects at import time and rely on the
# decorator calling the function, so the "unused" call at the bottom is the point.
"dags/*.py" = ["B018"]

[tool.pytest.ini_options]
# No pythonpath entry and no conftest sys.path hack: the package is installed
# (`pip install -e .`), so it imports like any other dependency.
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "airflow: test requires Airflow to be importable (DAG structure tests)",
]
