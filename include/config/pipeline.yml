# Pipeline tunables. Secrets live in .env, not here.

connections:
  mysql: mysql_staging
  postgres: postgres_analytics

paths:
  # Relative to include/, resolved from the project root at runtime.
  source_csv: data/raw/Flight_Price_Dataset_of_Bangladesh.csv
  reference_airports: data/reference/ref_airports.csv
  reference_allowed_values: data/reference/ref_allowed_values.csv
  corrupted_fixture: data/fixtures/corrupted_sample.csv
  sql: sql

ingest:
  batch_size: 5000

validation:
  # 5% not 2%: the fare-markup anomaly alone affects 4.42% of rows, so a
  # tighter gate would fail every run.
  reject_rate_threshold: 0.05
  fare_tolerance_bdt: 0.01

  datetime_format: '%Y-%m-%d %H:%i:%s'
  # Guards every STR_TO_DATE call: strict sql_mode raises on junk rather than
  # returning NULL, so the function must never see it.
  datetime_regex: '^[0-9]{4}-[0-9]{2}-[0-9]{2}[ T][0-9]{2}:[0-9]{2}:[0-9]{2}$'
  numeric_regex: '^[+-]?[0-9]+(\.[0-9]+)?$'

  # Profiled range is 0.5-15.83h; 48 catches a unit error without rejecting
  # real long-haul routing.
  max_duration_hrs: 48

business_rules:
  # 4.42% of rows carry total = (base + tax) * 1.2 exactly. Flagged, not
  # rejected -- deterministic, so probably a rule rather than corruption.
  fare_markup_factor: 1.2
  regular_season_label: Regular
