name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback. The pipeline package imports no Airflow, so lint and the
  # unit suite need nothing but Python — no image build, no databases.
  # Typical runtime: well under a minute.
  lint-and-unit:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install
        # -e . installs the package properly; no sys.path manipulation needed.
        run: pip install -e . ruff pytest

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Unit tests
        run: pytest tests/unit -v

  # Slower: needs Airflow importable to build a DagBag and assert the DAG's
  # structure. Pinned to the same version and constraints file the image uses,
  # so CI cannot silently drift from what actually runs.
  dag-structure:
    name: DAG structure tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Airflow against its constraints
        env:
          AIRFLOW_VERSION: '3.3.1'
          PY: '3.12'
        run: |
          CONSTRAINTS="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PY}.txt"
          pip install "apache-airflow==${AIRFLOW_VERSION}" \
                      apache-airflow-providers-mysql \
                      apache-airflow-providers-postgres \
                      apache-airflow-providers-common-sql \
                      pytest --constraint "${CONSTRAINTS}"
          pip install -e . --no-deps

      - name: DAG structure tests
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
          AIRFLOW__CORE__UNIT_TEST_MODE: 'true'
        run: pytest tests/dag -v

  # The only job that runs the real pipeline against real databases. The unit
  # suite proves the logic and the DAG tests prove the shape; neither would
  # catch a broken SQL statement, a bad connection URI or a schema mismatch.
  #
  # The assertions live in scripts/integration_test.sh rather than inline here,
  # so anyone debugging a red build can run exactly the same thing locally.
  integration:
    name: End-to-end pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # `make init` rather than a bare cp: it generates the Fernet key and JWT
      # secret, which compose references without defaults. Using the same
      # entry point a new contributor uses means CI exercises the documented
      # setup path instead of a special one that only works here.
      - name: Create .env
        run: make init

      # Matches assignments only: a comment mentioning REPLACE_ME is not a
      # placeholder secret, and the looser grep failed on exactly that.
      - name: Verify no placeholder secrets survived
        run: |
          if grep -qE '^[A-Z_]+=REPLACE_ME' .env; then
            echo "make init left placeholder secrets in .env"; exit 1
          fi

      - name: Build image
        run: docker compose build

      - name: Run end-to-end pipeline against the corrupted fixture
        run: ./scripts/integration_test.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
